# ── Server ──────────────────────────────────────────────
server.port=8080

# ── Ollama ──────────────────────────────────────────────
ollama.base-url=http://localhost:11434
ollama.embed-model=nomic-embed-text
ollama.gen-model=llama3.2
ollama.embed-timeout-seconds=30
ollama.generate-timeout-seconds=180

# ── Vector Store ─────────────────────────────────────────
vectordb.max-retrieval-distance=0.7
vectordb.chunk-words=250
vectordb.chunk-overlap=30

# ── Logging ──────────────────────────────────────────────
logging.level.com.vectordb=DEBUG
logging.level.org.springframework.web=INFO